[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-drift-evidently"
version = "0.1.0"
description = "End-to-end ML system for data drift detection and post-detection optimization using Evidently AI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ML Drift Evidently contributors" }]
keywords = ["mlops", "data-drift", "evidently", "monitoring", "retraining"]

dependencies = [
  "numpy>=1.24,<2.2",
  "pandas>=2.0,<2.3",
  "scipy>=1.10",
  "scikit-learn>=1.3,<1.6",
  "joblib>=1.3",
  "evidently>=0.4.0,<0.5",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
ml-drift = "ml_drift.pipeline.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
